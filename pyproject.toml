[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-screenshot"
version = "1.0.0"
description = "MCP server for taking Wayland screenshots via grim/slurp. Part of likezara™ MCP suite."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary — © 2026 likezara" }
authors = [
    { name = "Kamaru", email = "k.kamarux@gmail.com" },
]
maintainers = [
    { name = "likezara", email = "contact@likezara.com" },
]
keywords = ["mcp", "screenshot", "wayland", "grim", "slurp", "likezara"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
    "Topic :: Multimedia :: Graphics :: Capture :: Screen Capture",
]
dependencies = [
    "mcp>=1.27.0",
]

[project.urls]
Homepage = "https://github.com/KamaruSama/mcp-screenshot"
Repository = "https://github.com/KamaruSama/mcp-screenshot"
Issues = "https://github.com/KamaruSama/mcp-screenshot/issues"
Funding = "https://ko-fi.com/kamaru"

[project.scripts]
mcp-screenshot = "mcp_screenshot:main"

[tool.setuptools]
py-modules = ["mcp_screenshot"]
